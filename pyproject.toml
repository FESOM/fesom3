[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fesomx"
version = "0.1.0"
description = "JAX-based parallel grid computations with halo exchange for ocean/climate modeling"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "AWI Team"}
]
keywords = ["jax", "ocean-modeling", "hpc", "finite-volume", "halo-exchange"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "jax>=0.8.1",
    "jaxlib>=0.8.1",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "xarray>=2023.1.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
cuda = [
    "jax[cuda13]>=0.8.1",
]
full = [
    "uxarray>=2024.10.0",
    "pymetis>=2023.1",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["fesomx*"]

[tool.setuptools.package-data]
fesomx = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--strict-markers", "--tb=short"]
markers = [
    "slow: marks tests as slow",
    "gpu: marks tests requiring GPU",
    "cpu: marks tests for CPU-only",
    "parallel: marks tests for parallel execution",
]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W", "I", "N", "UP"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
